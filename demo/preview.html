<!DOCTYPE html>
<html lang="zh-CN" data-tbc-preview="true">
<head>
  <meta charset="utf-8">
  <title>Twitch Danmaku preview</title>
  <style>
    body {
      margin: 0;
      background: #0e0e10;
      color: #efeff1;
      font-family: "Inter", "Roobert", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    .layout {
      display: flex;
      gap: 16px;
      padding: 68px 16px 16px;
      align-items: flex-start;
    }
    .page-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 56px;
      z-index: 2000;
      background: #0e0e10;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      padding: 0 16px;
      box-sizing: border-box;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .page-header__toggle {
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 6px;
      background: #18181b;
      color: #adadb8;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 12px;
      cursor: pointer;
    }
    .page-header__toggle.is-on {
      color: #efeff1;
      border-color: #9147ff;
      background: rgba(145, 71, 255, 0.22);
    }
    .video-player__container {
      position: relative;
      width: 640px;
      height: 360px;
      background: #000;
      overflow: hidden;
    }
    .video-player__overlay {
      position: absolute;
      inset: 0;
    }
    .tbc-demo-stage {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      background: #0e0e10;
      pointer-events: none;
    }

    .tbc-demo-stage__bg,
    .tbc-demo-stage__glow,
    .tbc-demo-stage__sheen {
      position: absolute;
      inset: -40%;
      will-change: transform, background-position, opacity;
    }

    .tbc-demo-stage__bg {
      background: linear-gradient(
        120deg,
        #0e0e10 0%,
        #2b1055 18%,
        #9147ff 32%,
        #1a0a2e 48%,
        #0e0e10 62%,
        #772ce8 78%,
        #0e0e10 100%
      );
      background-size: 320% 320%;
      animation: tbc-demo-bg-shift 7s ease-in-out infinite;
    }

    .tbc-demo-stage__glow {
      background:
        radial-gradient(circle at 20% 30%, rgba(145, 71, 255, 0.75), transparent 42%),
        radial-gradient(circle at 80% 70%, rgba(191, 148, 255, 0.55), transparent 40%),
        radial-gradient(circle at 55% 15%, rgba(119, 44, 232, 0.45), transparent 38%);
      mix-blend-mode: screen;
      animation: tbc-demo-glow-drift 9s ease-in-out infinite;
    }

    .tbc-demo-stage__sheen {
      inset: -60%;
      background: linear-gradient(
        105deg,
        transparent 35%,
        rgba(255, 255, 255, 0.08) 48%,
        rgba(191, 148, 255, 0.22) 52%,
        transparent 65%
      );
      background-size: 220% 100%;
      animation: tbc-demo-sheen-sweep 5.5s linear infinite;
      opacity: 0.9;
    }

    .tbc-demo-stage__label {
      position: absolute;
      left: 24px;
      bottom: 20px;
      z-index: 2;
      color: #adadb8;
      font-size: 14px;
      line-height: 1.4;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.85);
      pointer-events: none;
    }

    .tbc-demo-stage__title {
      display: block;
      margin-bottom: 4px;
      color: #efeff1;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    @keyframes tbc-demo-bg-shift {
      0% { background-position: 0% 50%; transform: scale(1.05) rotate(0deg); }
      33% { background-position: 50% 100%; transform: scale(1.12) rotate(2deg); }
      66% { background-position: 100% 0%; transform: scale(1.08) rotate(-2deg); }
      100% { background-position: 0% 50%; transform: scale(1.05) rotate(0deg); }
    }

    @keyframes tbc-demo-glow-drift {
      0% { transform: translate(-12%, -8%) scale(1) rotate(0deg); }
      50% { transform: translate(14%, 10%) scale(1.15) rotate(12deg); }
      100% { transform: translate(-12%, -8%) scale(1) rotate(0deg); }
    }

    @keyframes tbc-demo-sheen-sweep {
      0% { background-position: -120% 0; transform: translateX(-8%); }
      100% { background-position: 220% 0; transform: translateX(8%); }
    }
    .player-controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 48px;
      z-index: 40;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.75));
    }
    .player-controls__right-control-group {
      position: absolute;
      right: 8px;
      top: 0;
      height: 48px;
      display: flex;
      align-items: center;
    }
    .chat-column {
      width: 340px;
      height: 596px;
      background: #18181b;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .stream-chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 40px;
      padding: 0 8px 0 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-weight: 600;
      font-size: 14px;
      box-sizing: border-box;
    }
    .stream-chat-header__title {
      flex: 1;
      min-width: 0;
    }
    .stream-chat-header__actions {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }
    .stream-chat-header__actions button[data-test-selector="chat-viewer-list"] {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      padding: 0;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: #efeff1;
      cursor: pointer;
    }
    .stream-chat-header__actions button[data-test-selector="chat-viewer-list"]:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    [data-a-target="chat-scroller"] {
      flex: 1;
      overflow: auto;
      padding: 8px 12px;
      font-size: 13px;
    }
    .chat-line__message {
      margin: 6px 0;
      line-height: 1.4;
      word-break: break-word;
    }
    .chat-author__display-name {
      font-weight: 700;
      margin-right: 6px;
    }
    .chat-line__message--emote {
      height: 1.2em;
      width: auto;
      vertical-align: middle;
      margin: 0 2px;
    }
    .chat-input-wrap {
      padding: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: flex-end;
      gap: 6px;
    }
    textarea[data-a-target="chat-input"] {
      flex: 1;
      min-width: 0;
      min-height: 40px;
      resize: vertical;
      border: 1px solid #3a3a3d;
      border-radius: 6px;
      background: #0e0e10;
      color: #efeff1;
      padding: 8px;
      font: inherit;
      box-sizing: border-box;
    }
    .chat-input-actions {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
      height: 40px;
    }
    .chat-input-actions button[data-a-target="bits-button"] {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      padding: 0;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: #efeff1;
      cursor: pointer;
    }
    .chat-input-actions button[data-a-target="bits-button"]:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    .toolbar {
      padding: 0 8px 8px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .toolbar button {
      background: #9147ff;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 8px 12px;
      cursor: pointer;
      font-weight: 600;
    }
    .toolbar button.secondary {
      background: #3a3a3d;
    }
    .hint {
      margin: 0 8px 10px;
      color: #adadb8;
      font-size: 12px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div class="page-header">
    <button type="button" id="demo-toggle-translate" class="page-header__toggle">翻译：关</button>
    <button type="button" id="demo-toggle-speech" class="page-header__toggle">朗读：关</button>
  </div>
  <div class="layout">
    <div class="video-player__container">
      <div class="tbc-demo-stage" aria-hidden="true">
        <div class="tbc-demo-stage__bg"></div>
        <div class="tbc-demo-stage__glow"></div>
        <div class="tbc-demo-stage__sheen"></div>
        <div class="tbc-demo-stage__label">
          <span class="tbc-demo-stage__title">Twitch Danmaku</span>
        </div>
      </div>
      <div class="video-player__overlay"></div>
      <div data-a-target="player-controls" class="player-controls">
        <div class="player-controls__right-control-group"></div>
      </div>
    </div>

    <div class="chat-column">
      <div class="stream-chat-header" role="region">
        <div class="stream-chat-header__title">Live Chat</div>
        <div class="stream-chat-header__actions">
          <button type="button" data-test-selector="chat-viewer-list" aria-label="Community" title="Community">
            <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path fill="currentColor" d="M7 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM4 10a3 3 0 0 0-3 3v2h8v-2a3 3 0 0 0-3-3H4zm9-1a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zm-1.5 1h3a2.5 2.5 0 0 1 2.5 2.5V15h-8v-2.5A2.5 2.5 0 0 1 11.5 10z"/></svg>
          </button>
        </div>
      </div>
      <div data-a-target="chat-scroller" data-test-selector="chat-scrollable-area__message-container" class="chat-scrollable-area__message-container">
        <div class="chat-line__message" data-a-target="chat-message-container" data-a-user="history">
          <a href="/history">
            <span data-a-target="chat-message-username" class="chat-author__display-name" style="color:#aaaaaa">History</span>
          </a>
          <div data-a-target="chat-line-message-body" class="chat-line__message-body">
            <span data-a-target="chat-message-text" class="text-fragment">already on screen</span>
          </div>
        </div>
      </div>
      <div class="chat-input-wrap">
        <textarea data-a-target="chat-input" placeholder="Send a message"></textarea>
        <div class="chat-input-actions" data-tbc-chat-input-actions>
          <button type="button" data-a-target="bits-button" aria-label="Bits" title="Bits">
            <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path fill="currentColor" d="M10 2 3 7v6l7 5 7-5V7l-7-5zm0 2.2 4.8 3.4v4.8L10 15.8 5.2 12.4V7.6L10 4.2z"/></svg>
          </button>
          <button type="button" data-a-target="emote-picker-button" aria-label="Emotes" title="Emotes">
            <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path fill="currentColor" d="M10 2a8 8 0 1 0 0 16 8 8 0 0 0 0-16zm-3 7a1.25 1.25 0 1 1 0-2.5A1.25 1.25 0 0 1 7 9zm7.5-1.25a1.25 1.25 0 1 1-2.5 0 1.25 1.25 0 0 1 2.5 0zM6.7 12.2a.75.75 0 0 1 1.05-.1 3.5 3.5 0 0 0 4.5 0 .75.75 0 1 1 .95 1.16 5 5 0 0 1-6.4 0 .75.75 0 0 1-.1-1.06z"/></svg>
          </button>
        </div>
      </div>
      <div class="toolbar">
        <button id="add-chat" type="button">Add chat</button>
        <button id="add-cheer" class="secondary" type="button">Add cheer</button>
        <button id="add-sub" class="secondary" type="button">Add sub</button>
      </div>
      <p class="hint">列表里已有的消息不会变成弹幕。预热结束后，点按钮或等待自动插入的新消息会从视频上飘过。顶栏可一键开关翻译与朗读，并与播放器按钮、设置面板同步。可试用滚动区域、Super Chat（位置、精简卡片、昵称与徽章同行、多条整齐堆叠、隐藏订阅、宽度与时长）、朗读、悬停暂停、复制到输入框、收藏与独轮车、右键菜单、增强画中画（拉伸或锁定比例，Chrome / Edge 116+）。连续观看、频道点数等系统通知和常见机器人消息不会进入弹幕。演示环境屏蔽与真实发送需 Twitch 登录。</p>
    </div>
  </div>

  <script>
    function GM_addStyle(css) {
      const style = document.createElement('style');
      style.textContent = css;
      document.documentElement.appendChild(style);
    }
    function GM_getValue(key, fallback) {
      try {
        const raw = localStorage.getItem('tbc-preview:' + key);
        return raw == null ? fallback : JSON.parse(raw);
      } catch (_) {
        return fallback;
      }
    }
    function GM_setValue(key, value) {
      localStorage.setItem('tbc-preview:' + key, JSON.stringify(value));
    }
    function GM_xmlhttpRequest(details) {
      if (details && typeof details.onerror === 'function') details.onerror({});
    }
    function GM_setClipboard(text) {
      if (navigator.clipboard) return navigator.clipboard.writeText(text);
    }
  </script>
  <script src="../dist/twitch-danmaku.user.js"></script>
  <script>
    const samples = [
      ['Alice', '#ff8a80', 'hello from chat'],
      ['小明', '#ffd600', '这是一条中文弹幕'],
      ['Bob', '#82b1ff', 'lol lol lol lol lol'],
      ['重复', '#ea80fc', '我不知道我不知道我不知道我不知道我不知道'],
      ['数字', '#b9f6ca', '666'],
      ['表情', '#ffab91', '😂😂😂'],
      ['长句', '#80d8ff', '这是一条比较长的弹幕，用来试听变速模式会不会在超过单条最长朗读时间之后自动加快语速。'],
    ];
    // Twitch Bits card presets → cheer-tier colors: 100 purple, 1000 teal, 5000 blue, 10000 red
    const cheerPresets = [
      { amount: 100, background: 'rgb(156, 62, 232)' },
      { amount: 1000, background: 'rgb(29, 178, 165)' },
      { amount: 5000, background: 'rgb(0, 153, 254)' },
      { amount: 10000, background: 'rgb(244, 48, 33)' },
    ];
    let seq = 0;
    let cheerSeq = 0;
    const scroller = document.querySelector('[data-a-target="chat-scroller"]');

    function addMessage(name, color, text, options = {}) {
      const item = document.createElement('div');
      item.className = 'chat-line__message';
      item.setAttribute('data-a-target', 'chat-message-container');
      item.setAttribute('data-a-user', String(name).toLowerCase());
      if (options.background) item.style.backgroundColor = options.background;

      const link = document.createElement('a');
      link.href = '/' + encodeURIComponent(name.toLowerCase());
      const author = document.createElement('span');
      author.setAttribute('data-a-target', 'chat-message-username');
      author.setAttribute('data-a-user', String(name).toLowerCase());
      author.className = 'chat-author__display-name';
      author.style.color = color;
      author.textContent = name;
      link.appendChild(author);

      const body = document.createElement('div');
      body.setAttribute('data-a-target', 'chat-line-message-body');
      body.className = 'chat-line__message-body';

      if (options.cheer) {
        const amount = Number(options.cheerAmount) || 100;
        const img = document.createElement('img');
        img.className = 'chat-line__message--emote';
        img.alt = options.cheer;
        img.setAttribute('data-emote-name', options.cheer);
        img.src = 'https://d3aqoihi2n8ty8.cloudfront.net/actions/cheer/dark/animated/' + amount + '/1.gif';
        body.appendChild(img);
        body.appendChild(document.createTextNode(' '));
      }

      const message = document.createElement('span');
      message.setAttribute('data-a-target', 'chat-message-text');
      message.className = 'text-fragment';
      message.textContent = text;
      body.appendChild(message);

      item.append(link, body);
      scroller.appendChild(item);
      scroller.scrollTop = scroller.scrollHeight;
    }

    const subPresets = [
      { name: 'cbas_o', color: '#253cdf', system: '已通过 Prime 订阅。这位用户已经订阅了 27 个月！', custom: 'Hii' },
      { name: 'okoklucy', color: '#9147ff', system: '已订阅第 1 层级', custom: '' },
      { name: 'karinsq2', color: '#00c7ac', system: '已通过 Prime 订阅', custom: 'welcome back' },
    ];
    let subSeq = 0;

    function addCheerMessage() {
      const preset = cheerPresets[cheerSeq % cheerPresets.length];
      cheerSeq += 1;
      addMessage('CheerFan', '#9147ff', 'thanks for the stream · ' + preset.amount + ' Bits', {
        cheer: 'Cheer' + preset.amount,
        cheerAmount: preset.amount,
        background: preset.background,
      });
      seq += 1;
    }

    function addSubMessage() {
      const preset = subPresets[subSeq % subPresets.length];
      subSeq += 1;
      const wrap = document.createElement('div');
      wrap.className = 'Layout-sc-1xcs6mc-0';

      const notice = document.createElement('div');
      notice.setAttribute('data-test-selector', 'user-notice-line');
      notice.className = 'Layout-sc-1xcs6mc-0';
      notice.style.overflowWrap = 'break-word';

      const body = document.createElement('div');
      const nameBtn = document.createElement('span');
      nameBtn.className = 'chatter-name';
      nameBtn.setAttribute('role', 'button');
      nameBtn.textContent = preset.name;
      body.append(nameBtn, document.createTextNode(' ' + preset.system));
      notice.appendChild(body);

      if (preset.custom) {
        const custom = document.createElement('div');
        custom.setAttribute('data-a-target', 'chat-resubscription-message__custom-message');
        const line = document.createElement('div');
        line.className = 'chat-line__message';
        line.setAttribute('data-a-target', 'chat-line-message');
        line.setAttribute('data-a-user', preset.name.toLowerCase());
        const author = document.createElement('span');
        author.className = 'chat-author__display-name';
        author.setAttribute('data-a-target', 'chat-message-username');
        author.setAttribute('data-a-user', preset.name.toLowerCase());
        author.style.color = preset.color;
        author.textContent = preset.name;
        const msgBody = document.createElement('span');
        msgBody.setAttribute('data-a-target', 'chat-line-message-body');
        const text = document.createElement('span');
        text.className = 'text-fragment';
        text.setAttribute('data-a-target', 'chat-message-text');
        text.textContent = preset.custom;
        msgBody.appendChild(text);
        line.append(author, document.createTextNode(': '), msgBody);
        custom.appendChild(line);
        notice.appendChild(custom);
      }

      wrap.appendChild(notice);
      scroller.appendChild(wrap);
      scroller.scrollTop = scroller.scrollHeight;
      seq += 1;
    }

    document.getElementById('add-chat').addEventListener('click', () => {
      const sample = samples[seq % samples.length];
      addMessage(sample[0], sample[1], sample[2] + ' ' + (++seq));
    });

    document.getElementById('add-cheer').addEventListener('click', () => {
      addCheerMessage();
    });

    document.getElementById('add-sub').addEventListener('click', () => {
      addSubMessage();
    });

    function syncDemoHeaderToggles() {
      const settings = window.__tbcGetSettings?.() || loadSettings();
      const translateBtn = document.getElementById('demo-toggle-translate');
      const speechBtn = document.getElementById('demo-toggle-speech');
      if (translateBtn) {
        const on = !!settings.translateEnabled;
        translateBtn.classList.toggle('is-on', on);
        translateBtn.textContent = on ? '翻译：开' : '翻译：关';
      }
      if (speechBtn) {
        const on = !!settings.speechEnabled;
        speechBtn.classList.toggle('is-on', on);
        speechBtn.textContent = on ? '朗读：开' : '朗读：关';
      }
    }

    document.getElementById('demo-toggle-translate')?.addEventListener('click', () => {
      if (window.__tbcToggleTranslate) {
        window.__tbcToggleTranslate();
        return;
      }
      const next = loadSettings();
      next.translateEnabled = !next.translateEnabled;
      saveSettings(next);
      window.__tbcApplySettings?.(next);
      syncDemoHeaderToggles();
    });

    document.getElementById('demo-toggle-speech')?.addEventListener('click', () => {
      if (window.__tbcToggleSpeech) {
        window.__tbcToggleSpeech();
        return;
      }
      const next = loadSettings();
      next.speechEnabled = !next.speechEnabled;
      saveSettings(next);
      window.__tbcApplySettings?.(next);
      syncDemoHeaderToggles();
    });

    window.addEventListener('tbc-settings-updated', syncDemoHeaderToggles);
    const bootWatch = setInterval(() => {
      if (!window.__tbcGetSettings) return;
      syncDemoHeaderToggles();
      clearInterval(bootWatch);
    }, 200);

    setTimeout(() => {
      samples.forEach((sample, index) => {
        setTimeout(() => addMessage(sample[0], sample[1], sample[2]), index * 700);
      });
      setTimeout(() => {
        addCheerMessage();
        setTimeout(() => addSubMessage(), 700);
      }, samples.length * 700);
    }, 4000);
  </script>
</body>
</html>
